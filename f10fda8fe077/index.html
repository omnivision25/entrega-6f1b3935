<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tu entrega · OmniVision</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="64x64" href="../icons/favicon-64.png">
<style>
  @font-face{ font-family:"Outfit"; font-style:normal; font-weight:200 500; font-display:swap; src:url(../fonts/outfit.woff2) format('woff2'); }
  @font-face{ font-family:"JetBrains Mono"; font-style:normal; font-weight:400 500; font-display:swap; src:url(../fonts/jetbrains-mono.woff2) format('woff2'); }
  :root{
    --bg:#050506; --bg-3:#11151b; --ink:#eef2f6; --ink-2:#b9c2cd; --mute:#7a8492;
    --line:rgba(238,242,246,.08); --line-2:rgba(238,242,246,.15);
    --blue:#0a8cc4; --blue-l:#53b8e6; --blue-rgb:10,140,196; --rec:#ff3b30; --warn:#f2b23b;
    --sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--bg); color-scheme:dark; }
  body{ min-height:100dvh; background:radial-gradient(90% 60% at 50% -10%, rgba(var(--blue-rgb),.18), transparent 70%), var(--bg);
        color:var(--ink); font-family:var(--sans); font-weight:300; font-size:16px; line-height:1.5;
        -webkit-font-smoothing:antialiased; padding:calc(var(--st) + 22px) 20px calc(var(--sb) + 28px); }
  main{ max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  .top{ display:flex; align-items:center; gap:10px; }
  .top img{ width:26px; height:26px; }
  .top b{ font-weight:400; letter-spacing:.02em; }
  .mono{ font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .tag::before{ content:"// "; color:var(--blue); }
  h1{ font-weight:200; font-size:clamp(30px, 8vw, 52px); line-height:1.05; letter-spacing:-.02em; }
  .stage{ position:relative; width:100%; margin:0 auto; border-radius:20px; overflow:hidden; background:#000;
          border:1px solid var(--line); box-shadow:0 30px 80px -30px rgba(var(--blue-rgb),.45); aspect-ratio:16/9; }
  .stage video{ position:absolute; inset:0; width:100%; height:100%; background:#000; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:56px; border-radius:16px;
        font:400 17px var(--sans); text-decoration:none; color:#fff; background:var(--blue); border:1px solid var(--blue);
        box-shadow:0 12px 36px -14px rgba(var(--blue-rgb),.95); transition:background .2s; }
  @media (hover:hover){ .btn:hover{ background:var(--blue-l); border-color:var(--blue-l); } }
  .btn small{ font:400 12px var(--mono); opacity:.75; }
  .aviso{ display:flex; gap:12px; align-items:flex-start; padding:16px 18px; border-radius:16px;
          border:1px solid rgba(242,178,59,.35); background:rgba(242,178,59,.07); color:var(--ink-2); font-size:15px; }
  .aviso b{ color:var(--ink); font-weight:500; }
  .aviso .dot{ flex:0 0 8px; height:8px; margin-top:7px; border-radius:50%; background:var(--warn); box-shadow:0 0 12px var(--warn); }
  footer{ text-align:center; margin-top:8px; }
  footer a{ color:var(--mute); text-decoration:none; }
  .pieza{ display:flex; flex-direction:column; gap:14px; }
  .pieza h2{ font-weight:300; font-size:clamp(20px,5vw,26px); letter-spacing:-.01em; }
  .nota{ color:var(--ink-2); font-size:15px; }
  .galeria{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .galeria a{ position:relative; display:block; aspect-ratio:1; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .galeria img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s; }
  @media (hover:hover){ .galeria a:hover img{ transform:scale(1.06); } }
</style>
</head>
<body>
<main>
  <div class="top"><img src="../icons/iris.svg" alt=""><b>OmniVision</b></div>
  <header><div class="mono tag">Tu entrega</div><h1>This is Michael</h1></header>
  <p class="nota">Tu aftermovie y las fotos del evento, listos para ver aquí y descargar en máxima calidad.</p>

  <section class="pieza" id="seccion-video" style="display:none">
    <div class="mono tag">Vídeo</div>
    <h2>Aftermovie</h2>
    <div class="stage"><video controls playsinline preload="metadata" poster="media/portada.jpg" src="media/aftermovie.mp4" title="This is Michael · aftermovie"></video></div>
    <a class="btn" id="descarga-video" href="media/aftermovie.mp4" download>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      Descargar <small id="peso-video"></small></a>
  </section>

  <section class="pieza" id="seccion-fotos" style="display:none">
    <div class="mono tag">Fotos</div>
    <h2>Galería</h2>
    <p class="nota">Toca una foto para verla y descargarla a tamaño completo, o descarga todas en un ZIP.</p>
    <div class="galeria" id="galeria"></div>
    <div id="descargas-zip" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <p class="mono" style="text-align:center;text-transform:none;letter-spacing:.04em" id="caducidad"></p>
  <footer><a class="mono" href="https://omnivisionspain.com">omnivisionspain.com</a></footer>
</main>
<script>
if(Date.now() >= new Date('FECHA_CADUCIDAD')){
  document.querySelector('main').innerHTML = '<div class="top"><img src="../icons/iris.svg" alt=""><b>OmniVision</b></div><header><h1>Este enlace ya ha caducado</h1></header><p class="nota">Escríbenos a <a href="mailto:info@omnivisionspain.com" style="color:var(--blue-l)">info@omnivisionspain.com</a> y te lo enviamos de nuevo.</p>';
}
</script>
</body>
</html>
